replicaCount: 2
image:
  repository: anadi07/flaskapp
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 5000
containerPort: 5000
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
env:
  APP_VERSION: '1.0.0'
  ENVIRONMENT: eks
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  namespace: monitoring
