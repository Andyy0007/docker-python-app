apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flask-app.fullname" . }}
  labels: {app.kubernetes.io/name: {{ include "flask-app.name" . }}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "flask-app.name" . }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "flask-app.name" . }}
    spec:
      containers:
        - name: flask-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{name: http, containerPort: {{ .Values.containerPort }}}]
          env:
            - {name: APP_VERSION, value: "{{ .Values.env.APP_VERSION }}"}
            - {name: ENVIRONMENT, value: "{{ .Values.env.ENVIRONMENT }}"}
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
          resources:
{{ toYaml .Values.resources | indent 12 }}
