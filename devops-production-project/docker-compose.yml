services:
  app:
    build: .
    ports: ['5000:5000']
    environment:
      APP_VERSION: '1.0.0'
      ENVIRONMENT: docker
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops-local-password
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devops -d devopsdb']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
