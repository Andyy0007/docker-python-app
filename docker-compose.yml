version: "3.8"

services:

  flask-app:
    build: .
    container_name: flask-container
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      DB_HOST: postgres
      DB_NAME: mydatabase
      DB_USER: admin
      DB_PASSWORD: password123
    depends_on:
      - postgres


  postgres:
    image: postgres:15
    container_name: postgres-container
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"